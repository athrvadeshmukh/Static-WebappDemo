<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrimeCart | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-logo">P</div>
          <div>
            <div class="brand-name">PrimeCart</div>
            <small>Create account</small>
          </div>
        </div>

        <h2>Sign up</h2>
        <form id="signupForm" class="auth-form">
          <label>
            Full name
            <input type="text" placeholder="Your name" required />
          </label>
          <label>
            Email address
            <input type="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" placeholder="Choose a password" required />
          </label>
          <label>
            Confirm password
            <input type="password" placeholder="Re-enter password" required />
          </label>

          <button type="submit" class="primary-btn full-width">Create account</button>
        </form>

        <p class="auth-footer">
          Already have an account?
          <a href="login.html">Login</a>
        </p>
        <a class="link-back" href="index.html">← Back to shopping</a>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
